<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Teste — Huginn</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body { font-family: monospace; background: #0f1117; color: #e2e8f0; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; gap: 24px; }
    h1 { color: #60a5fa; margin: 0; }
    #qrcode { background: white; padding: 16px; border-radius: 12px; }
    pre { background: #1a1d2e; border: 1px solid #2d3255; border-radius: 8px; padding: 16px; max-width: 600px; width: 100%; overflow-x: auto; font-size: 12px; white-space: pre-wrap; word-break: break-all; }
    button { background: #1428A0; color: white; border: none; padding: 12px 28px; border-radius: 8px; font-size: 14px; cursor: pointer; font-family: monospace; }
    button:hover { background: #1a35c4; }
    .label { color: #94a3b8; font-size: 12px; }
    .expires { color: #34d399; font-size: 13px; }
    .key-info { color: #fbbf24; font-size: 12px; }
  </style>
</head>
<body>
  <h1>QR de Cadastro — Teste</h1>
  <div id="qrcode"></div>
  <div class="expires" id="expiry"></div>
  <div class="key-info" id="keyinfo"></div>
  <div class="label">Payload JSON gerado:</div>
  <pre id="payload">Gerando...</pre>
  <button onclick="gerar()">↻ Gerar novo QR</button>

  <script>
    const CONFIG = {
      hmacKey:      'SRBR_HUGINN_ODIN_SECRET_2024',
      employeeId:   'TEST-001',
      employeeName: 'Funcionario Teste',
      area:         'TI',
      role:         'Desenvolvedor',
      systemId:     'SISTEMA_TESTE',
      systemName:   'Sistema de Teste',
      cardColor:    '#1428A0',
      validityMin:  60,
    }

    function generateNonce() {
      const arr = new Uint8Array(4)
      crypto.getRandomValues(arr)
      return Array.from(arr).map(b => b.toString(16).padStart(2, '0')).join('')
    }

    function toBase64Url(buffer) {
      const bytes = new Uint8Array(buffer)
      let bin = ''
      for (const b of bytes) bin += String.fromCharCode(b)
      return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '')
    }

    async function hmac(secret, data) {
      const enc = new TextEncoder()
      const key = await crypto.subtle.importKey(
        'raw', enc.encode(secret),
        { name: 'HMAC', hash: 'SHA-256' },
        false, ['sign']
      )
      const sig = await crypto.subtle.sign('HMAC', key, enc.encode(data))
      return toBase64Url(sig)
    }

    async function gerar() {
      const now       = Math.floor(Date.now() / 1000)
      const expiresAt = now + CONFIG.validityMin * 60
      const nonce     = generateNonce()

      const canonical = [
        1, 'REG', now, expiresAt, nonce,
        CONFIG.employeeId, CONFIG.employeeName, CONFIG.systemId
      ].join('|')

      const signature = await hmac(CONFIG.hmacKey, canonical)

      const payload = {
        version:    1,
        mode:       'REG',
        issued_at:  now,
        expires_at: expiresAt,
        nonce,
        employee: {
          id:   CONFIG.employeeId,
          name: CONFIG.employeeName,
          area: CONFIG.area,
          role: CONFIG.role,
        },
        card: {
          system:      CONFIG.systemId,
          system_name: CONFIG.systemName,
          card_color:  CONFIG.cardColor,
        },
        signature,
      }

      const json = JSON.stringify(payload)

      // Limpa e regera o QR
      document.getElementById('qrcode').innerHTML = ''
      new QRCode(document.getElementById('qrcode'), {
        text:         json,
        width:        280,
        height:       280,
        correctLevel: QRCode.CorrectLevel.M,
      })

      const expDate = new Date(expiresAt * 1000).toLocaleTimeString('pt-BR')
      document.getElementById('expiry').textContent  = `✓ Válido por ${CONFIG.validityMin} min — expira às ${expDate}`
      document.getElementById('keyinfo').textContent = `Chave: ${CONFIG.hmacKey}`
      document.getElementById('payload').textContent = JSON.stringify(payload, null, 2)
    }

    gerar()
  </script>
</body>
</html>
